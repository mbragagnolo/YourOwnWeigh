# Fully local YourOwnWeigh on one Windows PC (Docker Desktop).
#
#   Browser / bridge --http--> 127.0.0.1:${DASHBOARD_PORT} -> caddy -> yow:8080 (loopback only)
#   Scale  --http/https-->  ${SCALE_IP}:80/443 -> caddy -> yow:8081 (scale-only)
#
# The scale-only listener serves nothing but the scale's POST endpoints, so the
# dashboard is never reachable from the LAN. Nothing here needs the internet
# after the image is built (setup itself fetches settings/firmware from Withings).
name: yow-local

services:
  yow:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    image: yow:local
    container_name: yow
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Paris}
      # Must match the address the browser/bridge use (the Host header check).
      YOW_PUBLIC_ORIGIN: http://127.0.0.1:${DASHBOARD_PORT:-8095}
      YOW_SCALE_PORT: "8081"
      YOW_SCALE_HOST: 0.0.0.0
      YOW_SCALE_PROXY_HOST: yow:8081
      # Optional: Body Smart weather screen. Set both in .env to enable it. The
      # server then asks api.open-meteo.com for a forecast (coordinates rounded
      # to ~1 km) when the scale syncs: the only outbound call in normal use.
      YOW_WEATHER_LATITUDE: ${YOW_WEATHER_LATITUDE:-}
      YOW_WEATHER_LONGITUDE: ${YOW_WEATHER_LONGITUDE:-}
      # Optional: Body Smart result pages, in order. Names: bmi, fat, muscle,
      # water, bone, visceral, heart, weather, air. Unset keeps bmi, fat and
      # heart (plus weather when a place is set). Each page shows for about 3 s.
      YOW_WBS13_SCREENS: ${YOW_WBS13_SCREENS:-}
      # Garmin watch FIT files, copied in by connectors/Garmin/sync_watch.ps1.
      YOW_WATCH_INBOX: /watch-inbox
    volumes:
      - yow-data:/data            # SQLite DB + first-run bootstrap token
      - ./watch-inbox:/watch-inbox:ro
    # No published port: the image sets YOW_TRUST_PROXY=1, which treats a
    # request without X-Forwarded-Proto as https. The dashboard therefore goes
    # through caddy, which sends X-Forwarded-Proto: http (else the bridge page's
    # WebSocket and invitations fail the Origin check with 403).

  caddy:
    image: caddy:2.10-alpine
    container_name: yow-caddy
    restart: unless-stopped
    depends_on: [yow]
    environment:
      SCALE_IP: ${SCALE_IP:?set SCALE_IP in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data          # Caddy's internal (self-signed) CA
    ports:
      - "${SCALE_IP}:80:80"
      - "${SCALE_IP}:443:443"
      - "127.0.0.1:${DASHBOARD_PORT:-8095}:8080"   # dashboard + bridge: this PC only

volumes:
  yow-data:
  caddy-data:
